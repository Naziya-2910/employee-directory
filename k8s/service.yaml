apiVersion: v1
kind: Service
metadata:
  name: employee-directory
  labels:
    app: employee-directory
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
spec:
  type: LoadBalancer
  loadBalancerClass: eks.amazonaws.com/nlb
  selector:
    app: employee-directory
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
